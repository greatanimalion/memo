<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* 背景光效 */
    .bg-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      animation: pulse 4s ease-in-out infinite;
    }
    .bg-glow.purple { background: #7c3aed; top: 20%; left: 30%; }
    .bg-glow.blue { background: #3b82f6; bottom: 20%; right: 30%; animation-delay: 2s; }
    .bg-glow.pink { background: #ec4899; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 1s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.1); }
    }

    /* 网格背景 */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    }

    /* 主容器 */
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 28px;
    }
    .logo-ring {
      position: absolute;
      inset: -4px;
      border-radius: 20px;
      background: conic-gradient(from 0deg, transparent 0%, #7c3aed 25%, #3b82f6 50%, transparent 75%);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      -webkit-mask-composite: xor;
      padding: 1.5px;
      animation: spin 3s linear infinite;
    }
    .logo-ring.inner {
      inset: -10px;
      background: conic-gradient(from 180deg, transparent 0%, rgba(124,58,237,0.4) 25%, rgba(59,130,246,0.4) 50%, transparent 75%);
      animation-direction: reverse;
      animation-duration: 5s;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.15), rgba(59, 130, 246, 0.15));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .logo-icon svg {
      width: 36px;
      height: 36px;
    }

    /* 标题 */
    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    /* 进度条 */
    .progress-wrap {
      width: 180px;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      background: linear-gradient(90deg, #7c3aed, #3b82f6, #7c3aed);
      background-size: 200% 100%;
      animation: progress 2s ease-in-out forwards, shimmer 1.5s linear infinite;
    }
    @keyframes progress {
      0% { width: 0%; }
      30% { width: 45%; }
      60% { width: 70%; }
      100% { width: 95%; }
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* 底部版本 */
    .version {
      position: absolute;
      bottom: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.15);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="bg-glow purple"></div>
  <div class="bg-glow blue"></div>
  <div class="bg-glow pink"></div>
  <div class="grid-bg"></div>

  <div class="container">
    <div class="logo-wrap">
      <div class="logo-ring inner"></div>
      <div class="logo-ring"></div>
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#a78bfa"/>
              <stop offset="100%" stop-color="#60a5fa"/>
            </linearGradient>
          </defs>
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
          <path d="M8 7h6" opacity="0.6"/>
          <path d="M8 11h4" opacity="0.4"/>
        </svg>
      </div>
    </div>

    <div class="title">Memo</div>
    <div class="subtitle">Personal Writing</div>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>
  </div>

  <div class="version">v1.0.0</div>
</body>
</html>
