<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      animation: float 2s ease-in-out infinite;
    }
    .logo svg {
      width: 100%;
      height: 100%;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .title {
      color: #e0e0e0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 32px;
    }
    .loader {
      display: flex;
      gap: 6px;
    }
    .loader span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e94560;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .loader span:nth-child(1) { animation-delay: 0s; }
    .loader span:nth-child(2) { animation-delay: 0.16s; }
    .loader span:nth-child(3) { animation-delay: 0.32s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="15" y="10" width="70" height="80" rx="6" stroke="#e94560" stroke-width="3" fill="none"/>
      <line x1="30" y1="30" x2="70" y2="30" stroke="#e94560" stroke-width="2" stroke-linecap="round"/>
      <line x1="30" y1="42" x2="65" y2="42" stroke="#e94560" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <line x1="30" y1="54" x2="60" y2="54" stroke="#e94560" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <line x1="30" y1="66" x2="55" y2="66" stroke="#e94560" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    </svg>
  </div>
  <div class="title">Memo</div>
  <div class="loader">
    <span></span>
    <span></span>
    <span></span>
  </div>
</body>
</html>
